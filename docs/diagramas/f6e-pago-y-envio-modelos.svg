taforma muestra solo los medios que acepta cada artesano</text><polygon fill="#1F2A22" points="360.5,188.0947,370.5,192.0947,360.5,196.0947,364.5,192.0947" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="366.5" y1="192.0947" y2="192.0947"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="276" x="65.5" y="187.3398">Carrito con productos de uno o varios artesanos</text><polygon fill="#1F2A22" points="69.5,231.9922,59.5,235.9922,69.5,239.9922,65.5,235.9922" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="63.5" x2="371.5" y1="235.9922" y2="235.9922"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="174" x="75.5" y="216.2886">Por cada artesano: su modelo</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="290" x="75.5" y="231.2373">(directo o por la plataforma) y sus medios de pago</text><polygon fill="#1F2A22" points="360.5,260.9409,370.5,264.9409,360.5,268.9409,364.5,264.9409" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="366.5" y1="264.9409" y2="264.9409"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="255" x="65.5" y="260.186">Elige un medio por cada artesano del carrito</text><path d="M10,279.9409 L71,279.9409 L71,286.8896 L61,296.8896 L10,296.8896 L10,279.9409 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="672.4185" style="stroke:#000000;stroke-width:1.5;" width="1014.5" x="10" y="279.9409"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="16" x="25" y="293.1348">alt</text><text fill="#000000" font-family="Arial" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286" x="86" y="292.2588">[MODELO A: por la plataforma (recaudo y liberaci&#243;n)]</text><polygon fill="#1F2A22" points="738,313.8384,748,317.8384,738,321.8384,742,317.8384" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="372.5" x2="744" y1="317.8384" y2="317.8384"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140" x="379.5" y="313.0835">Crea el cobro del pedido</text><polygon fill="#1F2A22" points="69.5,342.7871,59.5,346.7871,69.5,350.7871,65.5,346.7871" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="63.5" x2="749" y1="346.7871" y2="346.7871"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="160" x="75.5" y="342.0322">Checkout del medio elegido</text><polygon fill="#1F2A22" points="383.5,371.7358,373.5,375.7358,383.5,379.7358,379.5,375.7358" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="377.5" x2="749" y1="375.7358" y2="375.7358"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287" x="389.5" y="370.981">Webhook: pago aprobado, rechazado o pendiente</text><line style="stroke:#1F2A22;stroke-width:1.0;" x1="372.5" x2="414.5" y1="404.6846" y2="404.6846"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="414.5" x2="414.5" y1="404.6846" y2="417.6846"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="373.5" x2="414.5" y1="417.6846" y2="417.6846"/><polygon fill="#1F2A22" points="383.5,413.6846,373.5,417.6846,383.5,421.6846,379.5,417.6846" style="stroke:#1F2A22;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="246" x="379.5" y="399.9297">Pedido "Recibido" solo con pago aprobado</text><polygon fill="#1F2A22" points="383.5,442.6333,373.5,446.6333,383.5,450.6333,379.5,446.6333" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="377.5" x2="656.5" y1="446.6333" y2="446.6333"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101" x="389.5" y="441.8784">Prepara el pedido</text><polygon fill="#1F2A22" points="932.5,471.582,942.5,475.582,932.5,479.582,936.5,475.582" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="372.5" x2="938.5" y1="475.582" y2="475.582"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252" x="379.5" y="470.8271">Crea la gu&#237;a de env&#237;o (simulada en el demo)</text><polygon fill="#1F2A22" points="383.5,500.5308,373.5,504.5308,383.5,508.5308,379.5,504.5308" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="377.5" x2="943.5" y1="504.5308" y2="504.5308"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="235" x="389.5" y="499.7759">Estados de la gu&#237;a (webhook o consulta)</text><line style="stroke:#1F2A22;stroke-width:1.0;" x1="372.5" x2="414.5" y1="533.4795" y2="533.4795"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="414.5" x2="414.5" y1="533.4795" y2="546.4795"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="373.5" x2="414.5" y1="546.4795" y2="546.4795"/><polygon fill="#1F2A22" points="383.5,542.4795,373.5,546.4795,383.5,550.4795,379.5,546.4795" style="stroke:#1F2A22;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="227" x="379.5" y="528.7246">Mapa de estados: Enviado y Entregado</text><polygon fill="#1F2A22" points="360.5,571.4282,370.5,575.4282,360.5,579.4282,364.5,575.4282" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="366.5" y1="575.4282" y2="575.4282"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275" x="65.5" y="570.6733">Confirma la entrega (o evento Delivered + plazo)</text><polygon fill="#1F2A22" points="738,615.3257,748,619.3257,738,623.3257,742,619.3257" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="372.5" x2="744" y1="619.3257" y2="619.3257"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="264" x="379.5" y="599.6221">Liberaci&#243;n al artesano: venta menos comisi&#243;n</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="234" x="379.5" y="614.5708">(API de pagos a terceros, a los 3-5 d&#237;as)</text><path d="M327,632.3257 L327,671.3257 L795,671.3257 L795,642.3257 L785,632.3257 L327,632.3257 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M785,632.3257 L785,642.3257 L795,642.3257 L785,632.3257 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="221" x="404.75" y="649.5195">Requiere concepto legal: la plataforma</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304" x="404.75" y="664.4683">retendr&#237;a fondos de terceros (Decreto 1692 de 2020).</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1024.5" y1="678.2231" y2="678.2231"/><text fill="#000000" font-family="Arial" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="311" x="15" y="688.541">[MODELO B: directo (sin comisi&#243;n; se empieza por este)]</text><polygon fill="#1F2A22" points="69.5,708.8208,59.5,712.8208,69.5,716.8208,65.5,712.8208" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="63.5" x2="371.5" y1="712.8208" y2="712.8208"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="251" x="75.5" y="708.0659">Datos de pago del artesano (medio elegido)</text><polygon fill="#1F2A22" points="645.5,737.7695,655.5,741.7695,645.5,745.7695,649.5,741.7695" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="651.5" y1="741.7695" y2="741.7695"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308" x="65.5" y="737.0146">Paga directamente (Nequi, Daviplata, transferencia...)</text><polygon fill="#1F2A22" points="383.5,766.7183,373.5,770.7183,383.5,774.7183,379.5,770.7183" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="377.5" x2="656.5" y1="770.7183" y2="770.7183"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="241" x="389.5" y="765.9634">Marca "pago recibido" y prepara el pedido</text><polygon fill="#1F2A22" points="932.5,810.6157,942.5,814.6157,932.5,818.6157,936.5,814.6157" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="657.5" x2="938.5" y1="814.6157" y2="814.6157"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="263" x="664.5" y="794.9121">Despacha por su cuenta (piloto: Servientrega,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="139" x="664.5" y="809.8608">contra entrega si aplica)</text><polygon fill="#1F2A22" points="383.5,839.5645,373.5,843.5645,383.5,847.5645,379.5,843.5645" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="377.5" x2="656.5" y1="843.5645" y2="843.5645"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216" x="389.5" y="838.8096">Registra la gu&#237;a y avanza los estados</text><polygon fill="#1F2A22" points="360.5,868.5132,370.5,872.5132,360.5,876.5132,364.5,872.5132" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="366.5" y1="872.5132" y2="872.5132"/><text f