.8555 L71.5,1058.8555 M58.5,1077.8555 L45.5,1092.8555 M58.5,1077.8555 L71.5,1092.8555 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#EAF8ED" height="46.1973" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="90" x="327.5" y="71"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="68" x="338.5" y="91.1318">Plataforma</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="76" x="334.5" y="107.2305">(front + API)</text><rect fill="#EAF8ED" height="46.1973" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="90" x="327.5" y="1018.2568"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="68" x="338.5" y="1038.3887">Plataforma</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="76" x="334.5" y="1054.4873">(front + API)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="57" x="626" y="115.2305">Artesano</text><ellipse cx="657.5" cy="50.5986" fill="#FBF3E9" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M657.5,58.5986 L657.5,85.5986 M644.5,66.5986 L670.5,66.5986 M657.5,85.5986 L644.5,100.5986 M657.5,85.5986 L670.5,100.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="57" x="626" y="1031.3887">Artesano</text><ellipse cx="657.5" cy="1042.8555" fill="#FBF3E9" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M657.5,1050.8555 L657.5,1077.8555 M644.5,1058.8555 L670.5,1058.8555 M657.5,1077.8555 L644.5,1092.8555 M657.5,1077.8555 L670.5,1092.8555 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFFFFF" height="46.1973" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="102" x="699" y="71"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdju