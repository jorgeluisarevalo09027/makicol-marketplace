sano</text><polygon fill="#1F2A22" points="360.5,188.0947,370.5,192.0947,360.5,196.0947,364.5,192.0947" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="366.5" y1="192.0947" y2="192.0947"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="276" x="65.5" y="187.3398">Carrito con productos de uno o varios artesanos</text><polygon fill="#1F2A22" points="69.5,231.9922,59.5,235.9922,69.5,239.9922,65.5,235.9922" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="63.5" x2="371.5" y1="235.9922" y2="235.9922"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="174" x="75.5" y="216.2886">Por cada artesano: su modelo</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="290" x="75.5" y="231.2373">(directo o por la plataforma) y sus medios de pago</text><polygon fill="#1F2A22" points="360.5,260.9409,370.5,264.9409,360.5,268.9409,364.5,264.9409" style="stroke:#1F2A22;stroke-width:1.0;"/><line style="stroke:#1F2A22;stroke-width:1.0;" x1="58.5" x2="366.5" y1="264.9409" y2="264.9409"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="255" x="65.5" y="260.186">Elige un medio por cada artesano del carrito</text><path d="M10,279.9409 L71,279.9409 L71,286.8896 L61,296.8896 L10,296.8896 L10,279.9409 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="613.5723" style="stroke:#000000;stroke-width:1.5;" width="931" x="10" y="279.9409"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="16" x="25" y="293.1348">alt</text><text fill="#000000" font-family="Arial" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286" x="86" y="292.2588">[MODELO A: por la plataforma (recaudo y liberaci&#243;n)]</text><poly